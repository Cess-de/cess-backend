<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص</title></head>
<body style="font-family:sans-serif;padding:16px;line-height:2;font-size:16px">
<h3>فحص تعديل الطالب</h3>
<input id="id" placeholder="رقمك الجامعي" inputmode="numeric" style="width:100%;padding:12px;font-size:16px;margin-bottom:8px">
<button id="go" style="padding:12px 20px;font-size:16px">ابدأ الفحص</button>
<div id="o" style="margin-top:16px"></div>
<script>
const U="https://bibhljpmmmcxcxhpbuqf.supabase.co/functions/v1/smooth-handler",
A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpYmhsanBtbW1jeGN4aHBidXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTQwMzIsImV4cCI6MjEwNTM3MDAzMn0.4z9qDoZ71ftWDVj8MoarqMzTTwai15I2myBs1gxI0l0";
const T=localStorage.getItem("cess-session-token");
async function c(a,i){const r=await fetch(U,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+A},body:JSON.stringify({action:a,input:{...i,token:T}})});let j={};try{j=await r.json()}catch(e){}return{s:r.status,j}}
document.getElementById("go").onclick=async()=>{
  const o=document.getElementById("o"),id=document.getElementById("id").value.trim(),L=[];
  o.innerHTML="جارٍ الفحص...";
  try{
    const me=await c("me",{});
    L.push(me.s===200&&me.j.data&&me.j.data.is_admin?"1) الجلسة والصلاحية: ✅ مشرف":"1) الجلسة والصلاحية: ❌ سجّل الدخول من جديد ("+me.s+")");
    const ls=await c("adminList",{});
    const has=ls.s===200&&ls.j.data&&ls.j.data.students.length&&("batch" in ls.j.data.students[0]);
    L.push("2) نسخة الدالة المنشورة: "+(has?"✅ جديدة":"❌ قديمة (لم يصلها آخر كود)"));
    const up=await c("adminUpdateStudent",{student_id:id,full_name:"اختبار",batch:"2022",email:""});
    L.push("3) التعديل: "+(up.s===200&&up.j.ok?"✅ يعمل":"❌ فشل — "+(up.j.error||("HTTP "+up.s))));
    L.push("4) الوقت: "+new Date().toLocaleTimeString("ar"));
  }catch(e){L.push("خطأ في الاتصال: "+e.message)}
  o.innerHTML=L.map(x=>"<div>"+x+"</div>").join("");
};
</script></body></html>
