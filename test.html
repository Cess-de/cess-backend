<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص</title></head>
<body style="font-family:sans-serif;padding:16px;line-height:1.8">
<h3>فحص تعديل الطالب</h3>
<p>اكتب رقمك الجامعي أنت (سيصبح اسمك «اختبار» ودفعتك 2022، وتعدّلهما بعدها).</p>
<input id="id" placeholder="الرقم الجامعي" inputmode="numeric" style="width:100%;padding:10px;margin-bottom:8px">
<button id="go" style="padding:10px 16px">فحص</button>
<pre id="o" dir="ltr" style="white-space:pre-wrap;background:#eee;padding:12px;border-radius:8px;margin-top:12px">اكتب الرقم ثم اضغط فحص</pre>
<script>
const U="https://bibhljpmmmcxcxhpbuqf.supabase.co/functions/v1/smooth-handler",
A="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpYmhsanBtbW1jeGN4aHBidXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTQwMzIsImV4cCI6MjEwNTM3MDAzMn0.4z9qDoZ71ftWDVj8MoarqMzTTwai15I2myBs1gxI0l0";
const T=localStorage.getItem("cess-session-token");
async function c(action,input){const r=await fetch(U,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+A},body:JSON.stringify({action,input:{...input,token:T}})});return "["+action+"] HTTP "+r.status+"\n"+(await r.text()).slice(0,350)}
document.getElementById("go").onclick=async()=>{
  const o=document.getElementById("o"),id=document.getElementById("id").value.trim();
  o.textContent="جارٍ الفحص...";
  try{o.textContent=[await c("me",{}),await c("adminList",{}),await c("adminUpdateStudent",{student_id:id,full_name:"اختبار",batch:"2022",email:""})].join("\n\n")}
  catch(e){o.textContent="خطأ: "+e.message}
};
</script></body></html>
