<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الموارد — CESS-UofT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B132B;--el:#141d38;--ac:#FFC72C;--t1:#fff;--t2:#A8B3CC;--card:rgba(255,255,255,.04);--bd:rgba(255,255,255,.1);--bad:#EF4444}
[data-theme=light]{--bg:#F4F6F9;--el:#fff;--t1:#0F172A;--t2:#64748B;--card:#fff;--bd:rgba(15,23,42,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:15px;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.w{max-width:900px;margin:0 auto}[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;color:var(--t1);flex:1;min-width:120px}
.logo i{width:28px;height:28px;background:var(--ac);border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--t1);font:600 13.5px Inter,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#0B132B;border-color:transparent}.sm{height:34px;padding:0 12px;font-size:12.5px}
h1{font-size:22px;font-weight:800}.sub{font-size:13px;color:var(--t2);line-height:1.7;margin:6px 0 14px}
.search{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--t1);font:inherit;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--bd);background:transparent;color:var(--t2);font:600 12.5px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:#0B132B;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.card .ic{font-size:26px}.card b{font-size:15px}.card p{font-size:13px;color:var(--t2);line-height:1.6}
.tg{align-self:flex-start;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--t2)}
.row{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--t2);line-height:1.9}
.sk{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--bd),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--el);color:var(--t1);padding:18px;width:min(96vw,860px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
iframe{width:100%;height:70vh;border:0;border-radius:10px;background:#fff}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body data-theme="dark">
<div class="w">
  <div id="boot"><div class="sk"></div></div>
  <div id="app" hidden>
    <div class="top">
      <a href="dashboard.html" class="logo"><i>🎓</i><span>CESS-UofT</span></a>
      <a class="btn sm" href="index.html">الرئيسية</a>
      <a class="btn sm" href="dashboard.html">لوحتي</a>
      <a class="btn sm pri" id="adm" href="admin.html" hidden>لوحة التحكم</a>
      <button class="btn sm" id="tt" aria-label="تبديل المظهر">🌙</button>
    </div>
    <h1>الموارد</h1>
    <p class="sub">ملفات ومراجع الجمعية، متاحة للأعضاء فقط.</p>
    <input class="search" id="q" type="search" placeholder="ابحث في الموارد" aria-label="بحث">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<script src="cess.js"></script>
<script>
const URL_="https://bibhljpmmmcxcxhpbuqf.supabase.co/functions/v1/"+CESS_FN,ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpYmhsanBtbW1jeGN4aHBidXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTQwMzIsImV4cCI6MjEwNTM3MDAzMn0.4z9qDoZ71ftWDVj8MoarqMzTTwai15I2myBs1gxI0l0";
const $=s=>document.querySelector(s),TOKEN=localStorage.getItem("cess-session-token"),dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function leave(){localStorage.removeItem("cess-session-token");location.href="login.html"}
async function call(a,i={}){let r;try{r=await fetch(URL_,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ANON},body:JSON.stringify({action:a,input:{...i,token:TOKEN}})})}catch{throw new Error("تعذّر الاتصال بالخادم، تحقق من الإنترنت.")}
const j=await r.json().catch(()=>({}));if(r.status===401)leave();if(!j.ok)throw new Error(j.error||"حدث خطأ غير متوقع");return j.data}
function theme(t){document.body.dataset.theme=t;localStorage.setItem("cess-theme",t);$("#tt").textContent=t==="dark"?"🌙":"☀️"}
$("#tt").onclick=()=>theme(document.body.dataset.theme==="dark"?"light":"dark");theme(localStorage.getItem("cess-theme")||"dark");
const KI={file:"📄",folder:"📁",doc:"📝",sheet:"📊",slides:"📽️",form:"📋",video:"🎬",link:"🔗"};
const OKEMB=/^https:\/\/(drive\.google\.com|docs\.google\.com)\/|^https:\/\/www\.youtube\.com\/embed\//;
let ALL=[],CAT="",Q="";
const card=r=>`<div class="card"><div class="ic">${KI[r.kind]||"🔗"}</div><b>${esc(r.title)}</b>${r.description?`<p>${esc(r.description)}</p>`:""}${r.category?`<span class="tg">${esc(r.category)}</span>`:""}<div class="row"><a class="btn pri sm" href="${esc(r.url)}" target="_blank" rel="noopener">فتح</a>${r.embed&&OKEMB.test(r.embed)?`<button class="btn sm" data-v="${esc(r.id)}">عرض هنا</button>`:""}</div></div>`;
function draw(){
  const cats=[...new Set(ALL.map(r=>r.category).filter(Boolean))].sort();
  $("#chips").innerHTML=cats.length?[["","الكل"],...cats.map(c=>[c,c])].map(([v,l])=>`<button class="chip ${CAT===v?"on":""}" data-c="${esc(v)}">${esc(l)}</button>`).join(""):"";
  const q=Q.trim().toLowerCase(),rs=ALL.filter(r=>(!CAT||r.category===CAT)&&(!q||(r.title+" "+(r.description||"")+" "+(r.category||"")).toLowerCase().includes(q)));
  $("#grid").innerHTML=rs.length?rs.map(card).join(""):`<div class="empty">${ALL.length?"لا نتائج مطابقة.":"لا توجد موارد منشورة بعد."}</div>`;
}
$("#q").oninput=e=>{Q=e.target.value;draw()};
$("#chips").onclick=e=>{const c=e.target.closest("[data-c]");if(c){CAT=c.dataset.c;draw()}};
$("#grid").onclick=e=>{
  const b=e.target.closest("[data-v]");if(!b)return;
  const r=ALL.find(x=>x.id===b.dataset.v);if(!r)return;
  dlg.innerHTML=`<div class="vh"><b>${esc(r.title)}</b><button class="btn sm" id="x">إغلاق</button></div><iframe src="${esc(r.embed)}" allow="autoplay; fullscreen" allowfullscreen></iframe><p class="sub">إن لم يظهر الملف فاضغط «فتح» (قد لا يكون مشاركًا أو يمنع العرض).</p>`;
  dlg.showModal();$("#x").onclick=()=>dlg.close();dlg.onclose=()=>{dlg.innerHTML=""};
};
(async()=>{
  if(!TOKEN)return leave();
  try{const m=await call("me");if(m.is_admin)$("#adm").hidden=false}catch(e){return leave()}
  $("#boot").hidden=true;$("#app").hidden=false;
  try{ALL=(await call("resList")).items;draw()}catch(e){$("#grid").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
})();
</script>
</body>
</html>
