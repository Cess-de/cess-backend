<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الأنشطة والإعلانات — CESS-UofT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B132B;--ac:#FFC72C;--t1:#fff;--t2:#A8B3CC;--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--ok:#22C55E;--bad:#EF4444;--el:#141d38}
[data-theme=light]{--bg:#EAF0F8;--t1:#0F172A;--t2:#5B6B82;--g:rgba(255,255,255,.62);--gb:rgba(15,23,42,.08);--ok:#15803D;--el:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;color:var(--t1);min-height:100vh;font-size:15px;padding:14px 14px 40px;background:radial-gradient(circle at 12% 8%,rgba(255,199,44,.28),transparent 38%),radial-gradient(circle at 90% 30%,rgba(59,130,246,.30),transparent 42%),var(--bg)}
.w{max-width:760px;margin:0 auto}[hidden]{display:none!important}
.glass{background:var(--g);border:1px solid var(--gb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 24px rgba(0,0,0,.16);border-radius:22px}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;color:var(--t1);flex:1}.logo i{width:28px;height:28px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--gb);background:var(--g);color:var(--t1);font:600 13px Inter,sans-serif;cursor:pointer;text-decoration:none;--spc:var(--t1)}
.pri{background:var(--ac);color:#0B132B;border-color:transparent;--spc:#0B132B}.btn:disabled{opacity:.55;cursor:not-allowed}.sm{height:34px;padding:0 13px;font-size:12.5px}
.loading{color:transparent!important;pointer-events:none}.loading::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid var(--spc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;padding:5px;gap:4px;margin-bottom:14px;border-radius:999px}.seg button{flex:1;height:40px;border:0;border-radius:999px;background:none;color:var(--t2);font:700 13.5px Inter,sans-serif;cursor:pointer}.seg button.on{background:var(--ac);color:#0B132B}
.card{padding:18px;margin-bottom:12px}.card b{font-size:16px}.card p{font-size:13.5px;color:var(--t2);line-height:1.8;margin:6px 0;white-space:pre-wrap}
.dt{font-size:12.5px;font-weight:700;color:var(--ac);margin-bottom:6px}.meta{font-size:12.5px;color:var(--t2);margin:6px 0 12px}
.bar{height:6px;border-radius:99px;background:var(--gb);overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--ac)}
.urg{border-color:rgba(239,68,68,.6)}
.empty{padding:40px 16px;text-align:center;color:var(--t2);line-height:1.9}
.sk{height:96px;margin-bottom:12px;border-radius:22px;background:linear-gradient(90deg,var(--g),var(--gb),var(--g));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
details summary{cursor:pointer;color:var(--t2);font-weight:700;margin:10px 4px}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:99;width:min(92vw,420px)}
.toast{padding:12px 16px;border-radius:16px;background:var(--el);border:1px solid var(--gb);font-size:13.5px;margin-bottom:8px}.toast.bad{border-color:var(--bad)}.toast.ok{border-color:var(--ok)}
</style></head>
<body data-theme="dark"><div class="w">
<header class="glass top"><a href="dashboard.html" class="logo"><i>🎓</i><span>CESS-UofT</span></a><a class="btn sm" href="index.html">الرئيسية</a><a class="btn sm" href="dashboard.html">لوحتي</a><button class="btn sm" id="tt">🌙</button></header>
<div class="glass seg"><button data-t="act" class="on">الأنشطة</button><button data-t="news">الإعلانات</button></div>
<div id="pa"><div class="sk"></div><div class="sk"></div></div><div id="pn" hidden><div class="sk"></div><div class="sk"></div></div></div>
<div id="toasts"></div>
<script src="cess.js"></script>
<script src="join.js"></script>
<script>
const URL_="https://bibhljpmmmcxcxhpbuqf.supabase.co/functions/v1/"+CESS_FN,ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpYmhsanBtbW1jeGN4aHBidXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTQwMzIsImV4cCI6MjEwNTM3MDAzMn0.4z9qDoZ71ftWDVj8MoarqMzTTwai15I2myBs1gxI0l0";
const $=s=>document.querySelector(s),TOKEN=localStorage.getItem("cess-session-token");
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function leave(){localStorage.removeItem("cess-session-token");location.href="login.html"}
async function call(a,i={},ms=15000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);let r;
  try{r=await fetch(URL_,{method:"POST",signal:c.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+ANON},body:JSON.stringify({action:a,input:{...i,token:TOKEN}})})}
  catch(e){throw new Error(e.name==="AbortError"?"الاتصال بطيء، حاول مرة أخرى.":"تعذّر الاتصال بالخادم.")}
  finally{clearTimeout(t)}
  const j=await r.json().catch(()=>({}));if(r.status===401)leave();if(!j.ok)throw new Error(j.error||"حدث خطأ");return j.data;
}
function toast(m,t="ok"){const e=document.createElement("div");e.className="toast "+t;e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),4500)}
function theme(t){document.body.dataset.theme=t;localStorage.setItem("cess-theme",t);$("#tt").textContent=t==="dark"?"🌙":"☀️"}
$("#tt").onclick=()=>theme(document.body.dataset.theme==="dark"?"light":"dark");theme(localStorage.getItem("cess-theme")||"dark");
const when=d=>new Date(d).toLocaleString("ar",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"});
const over=a=>new Date(a.ends_at||a.starts_at)<new Date();
const C=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
let ACT=[],NEWS=[];
function btn(a){
  if(over(a))return'<button class="btn" disabled>انتهى</button>';
  if(a.joined)return`<button class="btn" data-j="${E(a.id)}" data-v="0">✓ مسجّل — إلغاء التسجيل</button>`;
  if(a.capacity&&a.count>=a.capacity)return'<button class="btn" disabled>اكتمل العدد</button>';
  return`<button class="btn pri" data-j="${E(a.id)}" data-v="1">سجّلني</button>`;
}
const card=a=>`<div class="glass card"><div class="dt">📅 ${when(a.starts_at)}</div><b>${E(a.title)}</b>${a.description?`<p>${E(a.description)}</p>`:""}<div class="meta">${a.location?"📍 "+E(a.location)+" · ":""}👥 ${a.count}${a.capacity?" / "+a.capacity:""} مسجّل</div>${a.capacity?`<div class="bar"><i style="width:${Math.min(100,Math.round(a.count/a.capacity*100))}%"></i></div>`:""}${btn(a)}</div>`;
function drawA(){
  const up=ACT.filter(a=>!over(a)),past=ACT.filter(over).reverse();
  $("#pa").innerHTML=(up.length?up.map(card).join(""):'<div class="glass empty">لا توجد أنشطة قادمة حاليًا.</div>')+(past.length?`<details><summary>الأنشطة السابقة (${past.length})</summary>${past.map(card).join("")}</details>`:"");
}
function drawN(){
  const IC={info:"📢",event:"📅",urgent:"⚠️"};
  $("#pn").innerHTML=NEWS.length?NEWS.map(n=>`<div class="glass card ${n.kind==="urgent"?"urg":""}"><div class="dt">${IC[n.kind]||"📢"} ${n.pinned?"📌 ":""}${new Date(n.created_at).toLocaleDateString("ar",{day:"numeric",month:"long",year:"numeric"})}</div><b>${E(n.title)}</b>${n.body?`<p>${E(n.body)}</p>`:""}</div>`).join(""):'<div class="glass empty">لا توجد إعلانات حاليًا.</div>';
}
const fail=(box,e)=>{box.innerHTML=`<div class="glass empty">${E(e.message)}<br><button class="btn pri sm rt" style="margin-top:12px">إعادة المحاولة</button></div>`};
function load(){
  const ca=C("cess-act"),cn=C("cess-news");
  if(ca){ACT=ca;drawA()}if(cn){NEWS=cn;drawN()}
  call("actList").then(d=>{ACT=d.items;localStorage.setItem("cess-act",JSON.stringify(ACT));drawA()}).catch(e=>{if(!ca)fail($("#pa"),e)});
  call("annPublic").then(d=>{NEWS=d.items;localStorage.setItem("cess-news",JSON.stringify(NEWS));drawN()}).catch(e=>{if(!cn)fail($("#pn"),e)});
}
document.addEventListener("click",e=>{if(e.target.closest(".rt")){$("#pa").innerHTML=$("#pn").innerHTML='<div class="sk"></div><div class="sk"></div>';load()}});
$("#pa").onclick=async e=>{
  const b=e.target.closest("[data-j]");if(!b||b.disabled)return;
  b.classList.add("loading");b.disabled=true;
  try{const r=await call("actReg",{id:b.dataset.j,join:b.dataset.v==="1"});const a=ACT.find(x=>x.id===b.dataset.j);a.joined=r.joined;a.count+=r.joined?1:-1;toast(r.joined?"تم تسجيلك":"أُلغي تسجيلك");drawA()}
  catch(err){toast(err.message,"bad");b.classList.remove("loading");b.disabled=false}
};
function tab(t){document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#pa").hidden=t!=="act";$("#pn").hidden=t!=="news";history.replaceState(null,"",t==="news"?"#news":location.pathname)}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
if(!TOKEN)leave();else{tab(location.hash==="#news"?"news":"act");load()}
</script></body></html>
