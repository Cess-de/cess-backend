<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص النظام</title></head>
<body style="font-family:sans-serif;padding:16px;line-height:2;font-size:15px"><h3>فحص النظام</h3><button id="go" style="padding:10px 18px;font-size:16px">ابدأ الفحص</button><div id="o" style="margin-top:14px"></div>
<script>
const FILES=["index.html","login.html","activate.html","forgot-password.html","dashboard.html","admin.html","resources.html","profile.html","members.html","activities.html","vote.html","page.html","cess.js","pf.js","glass-strip.js","notify.js","join.js","like.js","home-feed.js","carousel.js","lightbox.js","admin-ext.js","admin-img.js","admin-roles.js","admin-site.js","admin-resources.js","admin-members.js","admin-news.js","admin-activities.js","admin-offices.js","admin-vote.js","admin-log.js"];
const ACT=["ping","siteSettings","pfPublic","pfStrip","pfDirectory","pfGet","pfLike","resList","resFolder","recoverStart","changePassword","annPublic","actList","offList","homeFeed","archiveList","elList","imgUpload","adminList","adminPfList","adminLeaderSet","adminAdmins","adminLogList","adminElList"];
const TB=["auth_accounts","auth_activation_codes","auth_activation_tokens","auth_sessions","auth_rate_limits","auth_admins","students","roles","site_settings","site_resources","site_folder_nodes","site_announcements","site_activities","site_activity_regs","site_offices","site_audit","member_profiles","member_achievements","member_likes","el_elections","el_positions","el_candidates","el_voters","el_ballots","members","otp_codes","activation_tokens","recovery_tokens","rate_limits","admins","permissions","settings","messages","notifications","achievements","activities","activity_participants","announcements","audit_log","initiatives","initiative_activities","leadership_history","objectives","office_members","offices","resource_categories","resources","timeline"];
const B="https://bibhljpmmmcxcxhpbuqf.supabase.co",ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpYmhsanBtbW1jeGN4aHBidXFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTQwMzIsImV4cCI6MjEwNTM3MDAzMn0.4z9qDoZ71ftWDVj8MoarqMzTTwai15I2myBs1gxI0l0";
document.getElementById("go").onclick=async()=>{
  const o=document.getElementById("o"),L=[],add=(k,t)=>L.push((k===true?"✅ ":k===false?"❌ ":"⚠️ ")+t),show=()=>{o.innerHTML=L.map(x=>"<div>"+x+"</div>").join("")};
  o.textContent="جارٍ الفحص...";let fn=null,okf=0;
  for(const f of FILES){
    try{
      const r=await fetch(f+"?v="+Date.now(),{cache:"no-store"});
      if(!r.ok){add(false,f+" — غير موجود ("+r.status+")");continue}
      const t=await r.text();
      if(f.endsWith(".js")&&t.trim().length<30){add(false,f+" — الملف فارغ");continue}
      if(f==="cess.js"){const m=t.match(/CESS_FN\s*=\s*"([^"]+)"/);fn=m&&m[1]}
      okf++;
    }catch(e){add(false,f+" — خطأ")}
  }
  add(okf===FILES.length,"الملفات: "+okf+" من "+FILES.length);
  if(!fn){add(false,"اسم الدالة في cess.js غير مقروء");show();return}
  const T=localStorage.getItem("cess-session-token");let okA=0;
  for(const a of ACT){
    try{
      const r=await fetch(B+"/functions/v1/"+fn,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ANON},body:JSON.stringify({action:a,input:{token:T}})});
      const j=await r.json().catch(()=>({}));
      if(j.error==="إجراء غير معروف.")add(false,"الدالة: "+a+" — غير منشورة (الصق الكتلة المناسبة)");
      else if(r.status===500&&a!=="resFolder")add(null,"الدالة: "+a+" — خطأ قاعدة بيانات (جدول/عمود ناقص، راجع SQL)");
      else okA++;
    }catch(e){add(false,"الدالة: "+a+" — تعذّر الاتصال")}
  }
  add(okA===ACT.length,"الدوال: "+okA+" من "+ACT.length);
  let safe=0;
  await Promise.all(TB.map(async t=>{
    try{
      const r=await fetch(B+"/rest/v1/"+t+"?select=*&limit=1",{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});
      if(r.status===404)return;
      if(r.status===401||r.status===403){safe++;return}
      const j=await r.json().catch(()=>null);
      if(Array.isArray(j)&&j.length)add(false,"أمان: الجدول "+t+" مكشوف ويُقرأ علنًا! نفّذ SQL التشديد فورًا");
      else add(null,"أمان: الجدول "+t+" لم يُقفل بعد (فارغ حاليًا). نفّذ SQL التشديد");
    }catch(e){}
  }));
  add(true,"أمان: "+safe+" جدولًا محميًا من القراءة المباشرة");
  show();
};
</script></body></html>
